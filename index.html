<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Personal Cash Flow" />
    <meta name="description" content="Track wallets, income, expenses, budgets, assets and debts — offline." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Personal Cash Flow</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-error" hidden>
      <h2>Could not load Personal Cash Flow</h2>
      <p>The app files failed to load. Try reloading, or serve the folder over http.</p>
      <button type="button" onclick="window.location.reload()">Reload</button>
    </div>
    <noscript><p style="text-align:center">Personal Cash Flow needs JavaScript enabled.</p></noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
